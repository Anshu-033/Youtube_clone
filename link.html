<!DOCTYPE html>
<html>
    <head>
        <title>Linkedln signup</title>
        <style>
            p{
                font-family: arial;
                font-size: 15px;
                font-family: arial;
                color: rgb(96, 96, 96);
                margin-top: 0;
                margin-bottom: 0;
            }
            .e{
                margin-bottom: 5px;
            }
            .tb{
                width: 250px;
                margin-bottom: 20px;
                border-radius: 3px;
            }
            .b{
                margin-top: 15px;
                width: 255px;
                padding-top: 15px;
                padding-bottom: 15px;
                border: none;
                background-color: rgb(0, 170, 255);
                color: white;
                border-radius: 65px;
            }
            .b:hover{
                transform: scalex(1.05);
            }
            .b:active{
                transform: translateY(4px);
            }

        </style>
    </head>
    <body>
        <p class="e">Email</p>
        <input class="tb" type="textbox" placeholder="enter your e-mail here">
        <p>By clicking Agree & Join, you agree the Priavcy Policy.</p>
        <button class="b">Agree & Join</button>
    </body>
</html>
