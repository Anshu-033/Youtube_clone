<!DOCTYPE html>
<html>
    <head>
        <title>Position Practice</title>
    </head>
    <body style="
        height: 3000px;
        padding-top: 60px;
        padding-left: 80px;
        
    ">
        <div style="
            background-color: black;
            color: white;
            height: 30px;
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: 50px;
            z-index: 1;
            ">
            header
        </div>

        <div style="
            background-color: green;
            color: white;
            position: fixed;
            left: 0;
            bottom: 0;
            top: 50px;
            width: 65px;

        ">
            Sidebar
            <div style="
                position: absolute;
                background-color: chocolate;
                color: white;
                right: 0;
                top: 0;
                ">
                x
            </div>
        </div>

        <div style="
        position: absolute;
        background-color: chocolate;
        color: white;
        right: 10px;
        top: 60px;

        ">
            Absolute
        </div>

        <div style="
            background-color: lightblue;
            width: 200px;
            height: 200px;
            position: static;
            
            
            ">
            Div 1
        </div>
        <div style="
            background-color: lightpink;
            width: 200px;
            height: 200px;
            position: relative;
            ">
            Div 2
            <div style="
            position: absolute;
            background-color: black;
            color: white;
            right: 10px;
            bottom: 10px;
            ">
                5:00
            </div>
        </div>
    </body>
</html>
